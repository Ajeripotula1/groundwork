# Local-only Postgres for development. In AWS this same role is played by
# Supabase (Postgres + pgvector) — the schema and queries we write against
# this container should work unchanged against Supabase later, since both
# are just Postgres with the pgvector extension enabled.
services:
  postgres:
    # Official pgvector image: plain Postgres 16 with the pgvector extension
    # pre-built, so `CREATE EXTENSION vector;` works without compiling anything.
    image: pgvector/pgvector:pg16
    container_name: groundwork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5432:5432"
    volumes:
      # Named volume so data survives `docker compose down` (but not `-v`).
      - groundwork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local-only trace viewer for the agent (groundwork.agent.tracing).
  # Receives OTLP traces Strands already emits per model/tool call - no
  # custom code needed to read them, just a UI at http://localhost:16686.
  # Dev tool only, like Postgres above - production tracing (AgentCore
  # Observability or similar) is a separate decision, BUILD_PLAN.md Slice 9.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: groundwork-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # web UI
      - "4318:4318"   # OTLP HTTP receiver - what setup_otlp_exporter() sends to

volumes:
  groundwork_pgdata:
