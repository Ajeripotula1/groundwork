[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsentinel"
version = "0.1.0"
description = "Agentic job tracker and assistant."
requires-python = ">=3.12"
dependencies = [
    # Typed, validated settings loaded from environment variables / .env.
    # See src/jobsentinel/config.py for why this replaces scattered os.getenv() calls.
    "pydantic-settings>=2.4",
    # ORM models (jobsentinel.db.models) are the schema's source of truth;
    # Alembic autogenerates migrations by diffing them against the live DB.
    # Data-access functions (jobsentinel.db.jobs, etc.) still hand callers
    # plain dicts, not live ORM objects — see jobsentinel/db/jobs.py for why.
    "sqlalchemy>=2.0",
    # Postgres driver (psycopg 3, the current generation — not psycopg2).
    "psycopg[binary]>=3.1",
    # Migration tool: versions the schema as an ordered set of SQL changes,
    # tracked in a schema_migrations-equivalent table Alembic manages itself.
    "alembic>=1.13",
    # HTTP client used by the ATS exploration/loading scripts (Greenhouse,
    # Ashby, Lever) - declared here (not just used ad hoc) now that
    # scripts/load_jobs.py makes pulling job data a real part of the app,
    # not just a throwaway exploration step.
    "requests>=2.31",
    # HTML-to-Markdown extraction for job descriptions (scripts/job_text.py)
    # - Greenhouse/Lever both hand back rich-text HTML; converting to
    # Markdown (not flattened plain text) keeps headings/bold/bullets
    # instead of discarding them, while staying just as LLM-readable.
    "markdownify>=1.2.3",
    # The API unit (Slice 2 on): thin HTTP layer over jobsentinel/db and,
    # from Slice 3 on, jobsentinel/agent. Mangum-wrapping for Lambda is a
    # later (deployment) slice - locally this just runs under uvicorn.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # FastAPI requires this to parse multipart/form-data (file uploads) -
    # not a direct import in our code, but UploadFile silently 500s without
    # it installed.
    "python-multipart>=0.0.9",
    # AWS SDK - Bedrock Runtime client for the resume-extraction utility
    # (Slice 2) and, from Slice 3 on, the Strands agent's model backend.
    "boto3>=1.34",
    # PDF text extraction for resume uploads (Slice 2 - scope extended
    # from "raw text only" once upload was actually needed). Pure-Python,
    # no system-level dependency (unlike e.g. pdftotext/poppler) - good
    # enough for typical single-column resume PDFs; revisit if real
    # uploads come back with garbled/missing text.
    "pypdf>=4.0",
    # [otel] extra pulls in opentelemetry-exporter-otlp-proto-http - Strands'
    # trace/tool-call instrumentation already exists without it (see
    # jobsentinel/agent/shared/tracing.py), but setup_otlp_exporter() (what
    # sends those traces to Jaeger) needs the actual OTLP exporter package.
    "strands-agents[otel]>=1.56.0",
    "strands-agents-tools>=0.8.9",
    # BedrockAgentCoreApp - the ASGI app + @app.entrypoint decorator each
    # agent module (jobsentinel/agent/score_fit, jobsentinel/agent/job_agent)
    # exposes so `agentcore launch` can deploy it as its own Runtime
    # container. Local-only for now (no Memory/Gateway/Identity resources
    # configured yet) - just the deployment shape.
    "bedrock-agentcore>=1.23.1",
    # JWT verification for Clerk-issued session tokens (jobsentinel.api.auth).
    # The [crypto] extra pulls in `cryptography`, needed for RS256 - Clerk
    # signs with RS256, not the symmetric HS256 PyJWT supports out of the box.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # FastAPI's TestClient (starlette.testclient) needs this to actually
    # issue requests against the app in-process, without a real server.
    "httpx2>=1.0",
    # `agentcore` CLI (configure/launch/invoke) - the runtime package
    # (bedrock-agentcore, main deps) only gives each agent module its
    # BedrockAgentCoreApp; this is what builds/runs it as an actual
    # AgentCore Runtime container. Dev-only: never needed at runtime inside
    # the deployed container itself.
    "bedrock-agentcore-starter-toolkit>=0.3.13",
]

# Layer 0 uses a "src layout": the importable package lives under src/jobsentinel
# instead of at the repo root. This forces tests and tooling to import the
# *installed* package (via `pip install -e .`) rather than accidentally
# picking up whatever happens to be in the current working directory —
# which is a common source of "works on my machine" bugs in flat layouts.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    # Hits a real external service (Bedrock) - costs tokens, is slower, and
    # is non-deterministic. Excluded from the routine fast run via
    # `pytest -m "not integration"`; run deliberately with `-m integration`.
    "integration: hits a real external service, not mocked",
]
